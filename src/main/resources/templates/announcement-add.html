<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>新增公告</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2 class="mt-4">新增公告</h2>

    <form id="announcementForm" action="#" th:action="@{/announcements/save}" method="post" enctype="multipart/form-data" onsubmit="return checkForm(this)">
        <div class="mb-3">
            <label class="form-label">標題</label>
            <input type="text" class="form-control" name="title" required>
        </div>

        <div class="mb-3">
            <label class="form-label">公布者</label>
            <input type="text" class="form-control" name="author" required>
        </div>

        <div class="mb-3">
            <label class="form-label">發佈日期</label>
            <input type="date" class="form-control" name="publishDate" required>
        </div>

        <div class="mb-3">
            <label class="form-label">截止日期</label>
            <input type="date" class="form-control" name="expireDate" required>
        </div>

        <div class="mb-3">
            <label class="form-label">公告內容</label>
            <textarea class="form-control" name="content" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">上傳附件</label>
            <input type="file" class="form-control" name="file">
        </div>

        <button type="submit" class="btn btn-success">提交</button>
        <a href="/announcements/list" class="btn btn-secondary">返回</a>
    </form>
</div>
<p id="errorMessage" style="color: red; display: none;">發布日不能晚於截止日！</p>
</body>
<script>
    document.getElementById("announcementForm").addEventListener("submit", function(event) {
        let publishDate = new Date(document.getElementById("publishDate").value);
        let expireDate = new Date(document.getElementById("expireDate").value);

        if (publishDate >= expireDate) {
            event.preventDefault();
            document.getElementById("errorMessage").style.display = "block";
        } else {
            document.getElementById("errorMessage").style.display = "none";
        }
    });
</script>
</html>
