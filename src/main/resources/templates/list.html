<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>公告列表</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2 class="mt-4">公告列表</h2>
    <a href="/add" class="btn btn-primary my-3">新增公告</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>標題</th>
            <th>公布者</th>
            <th>發佈日期</th>
            <th>截止日期</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="announcement : ${announcements}">
            <td th:text="${announcement.title}"></td>
            <td th:text="${announcement.author}"></td>
            <td th:text="${announcement.publishDate}"></td>
            <td th:text="${announcement.expireDate}"></td>
            <td>
                <a th:href="@{/edit/{id}(id=${announcement.id})}" class="btn btn-sm btn-warning">編輯</a>
                <button class="btn btn-sm btn-danger" th:attr="data-id=${announcement.id}" onclick="deleteAnnouncement(this)">刪除</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function deleteAnnouncement(button) {
        let id = button.getAttribute("data-id");
        if (confirm("確定要刪除嗎？")) {
            fetch(`/api/announcements/${id}`, { method: "DELETE" })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert("刪除失敗！");
                    }
                });
        }
    }
</script>

</body>
</html>
