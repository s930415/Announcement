<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>公告列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">公告列表</h2>
    <a href="/announcements/add" class="btn btn-primary my-3">新增公告</a>
    <div th:if="${successMessage}" class="alert alert-success" id="alertBox" th:text="${successMessage}">
    </div>
    <form th:action="@{/announcements/delete}" method="post" id="deleteForm" >
    </form>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>標題</th>
            <th>公布者</th>
            <th>發佈日期</th>
            <th>截止日期</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="announcement : ${announcementPage.content}">
            <td th:text="${announcement.title}"></td>
            <td th:text="${announcement.author}"></td>
            <td th:text="${announcement.publishDate}"></td>
            <td th:text="${announcement.expireDate}"></td>
            <td>
                <a th:href="@{/announcements/edit/{id}(id=${announcement.id})}" class="btn btn-sm btn-warning">編輯</a>
                <button class="btn btn-sm btn-danger" th:attr="data-id=${announcement.id}" onclick="deleteAnnouncement(this)">刪除</button>
            </td>
        </tr>
        </tbody>
    </table>
    <!-- 分頁按鈕 -->
    <nav>
        <ul class="pagination">
            <li class="page-item" th:classappend="${announcementPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/announcements/list(page=${announcementPage.number - 1}, size=${announcementPage.size})}">上一頁</a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, announcementPage.totalPages - 1)}"
                th:classappend="${i == announcementPage.number} ? 'active'">
                <a class="page-link" th:href="@{/announcements/list(page=${i}, size=${announcementPage.size})}" th:text="${i + 1}"></a>
            </li>

            <li class="page-item" th:classappend="${announcementPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/announcements/list(page=${announcementPage.number + 1}, size=${announcementPage.size})}">下一頁</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function deleteAnnouncement(button) {
        let announcementId = button.getAttribute("data-id");
        if (!confirm("確定要刪除嗎？")) {
            return;
        }
        let form = document.getElementById("deleteForm");
        form.action = "/announcements/delete/" + announcementId;
        form.submit(); // 送出表單
    }
</script>

</body>
</html>
